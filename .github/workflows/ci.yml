name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            args: ''
          - name: transcription
            args: '--no-default-features --features transcription'
          - name: tts-only
            args: '--no-default-features'
    name: Rust (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Also keys on rustc, Cargo.toml features, lockfile and compiler flags.
          # Workspace/incremental artifacts are intentionally excluded.
          key: ubuntu-24.04
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets ${{ matrix.args }}

      - name: Run tests
        run: cargo test --locked --all-targets ${{ matrix.args }}

      - name: Run documentation examples
        run: cargo test --locked --doc ${{ matrix.args }}

      - name: Install isolated Redis test dependency
        run: sudo apt-get update && sudo apt-get install -y redis-server

      - name: Run Redis integration tests (temporary Unix sockets only)
        run: cargo test --locked ${{ matrix.args }} --lib database::database::tests -- --include-ignored

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test transcript dashboard in Chromium
        run: |
          python3 -m venv /tmp/ncb-browser-test
          /tmp/ncb-browser-test/bin/pip install playwright==1.49.1
          /tmp/ncb-browser-test/bin/playwright install --with-deps chromium
          /tmp/ncb-browser-test/bin/python tests/dashboard_browser.py

  container:
    needs: [rust, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          pull: true
          platforms: linux/amd64
          cache-from: type=gha,scope=ncb-tts-r2-ci
          cache-to: type=gha,scope=ncb-tts-r2-ci,mode=max
